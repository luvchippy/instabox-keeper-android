name: instabox-keeper-android

on:
  workflow_dispatch:

concurrency:
  group: instabox-keeper-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify new PAT can chain
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-keeper.yml/dispatches" \
            -d '{"ref":"main"}' -w "dispatch HTTP %{http_code}\n"
