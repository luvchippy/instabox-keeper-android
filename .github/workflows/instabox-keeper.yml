name: instabox-keeper-android

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: instabox-keeper-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keeper:
    runs-on: ubuntu-latest
    # GitHub caps a job at 360 minutes; stay well inside it and chain the next.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep running for 5h40m
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: ${{ secrets.INSTABOX_MACHINE }}
          INSTABOX_BUFFER_MINUTES: '20'
          INSTABOX_HEALTHCHECK_CMD: 'timeout 8 adb devices 2>/dev/null | grep -qw device || { adb kill-server 2>/dev/null; docker restart instabox-android >/dev/null 2>&1; }'
        run: |
          END=$(( $(date +%s) + 20400 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            python instabox_keeper.py || true
            sleep 600
          done

      - name: Chain the next round
        if: always()
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-keeper.yml/dispatches" \
            -d '{"ref":"main"}' -w "dispatch HTTP %{http_code}\n"

      - name: Daily activity stamp
        if: always()
        run: |
          mkdir -p .state
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$(cat .state/last-active 2>/dev/null)" != "$TODAY" ]; then
            echo "$TODAY" > .state/last-active
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .state/last-active
            git commit -m "activity $TODAY" || true
            git push || true
          fi
